[project]
name = "game2health"
version = "0.1.0"
description = "Desktop motion game controller: MediaPipe Pose -> keyboard input via PySide6"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    # mediapipe 1.x aborts at graph init on macOS 26 (DrishtiMetalHelper
    # "Service is unavailable"), even with the CPU delegate; 0.10.35 verified
    # working with the same .task model and tasks API.
    "mediapipe>=0.10.35,<1",
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
    "pynput>=1.7.7,<2",
    "evdev>=1.7,<2; sys_platform == 'linux'",
]

[project.scripts]
game2health = "game2health.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = true
